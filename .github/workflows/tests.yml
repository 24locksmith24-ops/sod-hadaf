name: tests
on:
  pull_request:
  push:
    branches: [main]
    paths: ['engine.py', 'forbidden.py', 'index.html', 'siddur_import.py', 'lessons_store.py', 'requirements.txt', 'tests/**', '.github/workflows/tests.yml']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements.txt
      - name: 'Unit tests - offline, no model call, no network'
        run: python -m unittest discover -s tests -v
